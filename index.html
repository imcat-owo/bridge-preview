/* ===== 三层 token（原始层 → 语义层 → 组件层），组件里不许出现裸色值 ===== */
:root{
  /* 原始层：源头色卡 + 单源圆角 + 间距节律 */
  --moon-cream:#F5F6F0; --sage:#8FA98F; --pale-sage:#DDE7D6; --grey-green:#75886F; --pearl:#FEFEFA;
  --ink-src:#3F4F3C; --ink2-src:#64755C; --title-src:#51704C; --ph-src:#A9BBA0;
  --radius:18px;                 /* 基准圆角：卡片 ×1、气泡 ×0.8、圆钮 50% */
  --gutter:16px;
  /* 语义层：表面与其上的字成对定义 */
  --paper:var(--moon-cream);
  --glass-face:var(--pearl); --glass-ink:var(--ink-src);
  --ink:var(--ink-src); --ink-2:var(--ink2-src); --ink-ph:var(--ph-src); --title:var(--title-src);
  --line:rgba(117,136,111,.38);
  --shadow-1:0 3px 10px rgba(117,136,111,.14);
  --shadow-2:0 6px 18px rgba(117,136,111,.16);
  --breath-1:rgba(117,136,111,.36); --breath-2:rgba(143,169,143,.18);
}

/* 壁纸之上的月光协调罩：中部更透，让壁纸的透光留白和消息流融为一体 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(245,246,240,.30), rgba(245,246,240,.10) 34%, rgba(245,246,240,.14) 68%, rgba(245,246,240,.36));}
header,main,footer{position:relative;z-index:1;width:100%;max-width:760px;margin-inline:auto}

/* ===== 顶部栏：图片玻璃圆钮（新款单线描边） ===== */
header{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px var(--gutter) 0}
.hbtn{width:40px;height:40px;flex:0 0 40px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hbtn img{width:34px;height:34px;display:block}
.hbtn:active{transform:scale(.94)}
.title{flex:1;text-align:center}
.title .name{font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:16px;font-weight:500;letter-spacing:.34em;text-indent:.34em;color:var(--title)}
.title .model{font-size:10px;color:var(--ink-2);margin-top:3px;letter-spacing:.14em}

/* ===== 消息流：整体收小，分区距 28 ===== */
main{flex:1;padding:28px var(--gutter) 196px;display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.avatar{width:34px;height:34px;flex:0 0 34px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 28%, var(--pearl), var(--pale-sage) 82%);
  border:1px solid var(--line);box-shadow:var(--shadow-1);
  display:flex;align-items:center;justify-content:center}
.avatar img{width:88%;height:88%;object-fit:contain;display:block}
.col{display:flex;flex-direction:column;max-width:74%}
.row.me .col{align-items:flex-end}
.who{font-size:11px;letter-spacing:.18em;color:var(--ink-2);margin:2px 2px 6px}
.who .time{font-size:10px;letter-spacing:.06em;margin-inline-start:8px}

/* 思考小条 */
.think{margin-top:6px;margin-inline-start:2px;font-size:11px;color:var(--ink-2);letter-spacing:.08em;
  display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--grey-green);display:block;
  animation:thinkpulse 1.6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.22s}.dots i:nth-child(3){animation-delay:.44s}
@keyframes thinkpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}

/* ===== 底部输入区（锁定款）：图片胶囊面板 + 面板内真输入框与圆钮 ===== */
footer{position:sticky;bottom:0;z-index:5;padding:8px var(--gutter) calc(10px + env(safe-area-inset-bottom))}
.inputwrap{position:relative;z-index:0;aspect-ratio:1080/338;animation:fadeUp .45s ease-out both}
/* 生成中才出现的单色鼠尾草绿呼吸雾光（软扩散）；空闲完全无光 */
.inputwrap::before{content:"";position:absolute;inset:0;border-radius:999px;z-index:-1;opacity:0;
  box-shadow:0 0 20px 5px var(--breath-1), 0 0 40px 13px var(--breath-2)}
.inputwrap.generating::before{animation:breath 2.6s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.3}to{opacity:.75}}
.inputwrap img.panel{position:absolute;inset:0;width:100%;height:100%;display:block}
/* 输入行占满面板全高：按钮与输入文字都居中在面板的竖直中心高度 */
.inputrow{position:absolute;inset:0;display:flex;align-items:center;padding:0 4.5%}
.inputrow input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;height:40px;
  font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:15px;color:var(--ink);
}
.inputrow input::placeholder{color:var(--ink-ph);font-style:italic}
.ibtn{width:40px;height:40px;flex:0 0 40px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ibtn img{width:32px;height:32px;display:block}
.ibtn:active{transform:scale(.92)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

  function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
  function addRow(cls,av,who,text){
    var r=el('<div class="row '+cls+'"><div class="avatar"><img src="'+av+'" alt=""></div>'+
      '<div class="col"><div class="who">'+who+'</div><div class="bubble"></div></div></div>');
    r.querySelector('.bubble').textContent=text;
    flow.insertBefore(r, flow.querySelector('.hint'));
    r.scrollIntoView({behavior:'smooth',block:'end'}); return r;
  }
  function reply(userText){
    if(busy) return; busy=true;
    wrap.classList.add('generating');           /* 生成中：输入栏单色鼠尾草绿呼吸光（本流程约 3s） */
    var t=el('<div class="row ai"><div class="avatar"><img src="'+AVMOON+'" alt=""></div>'+
      '<div class="col"><div class="who">小管家</div>'+
      '<div class="think"><span class="dots"><i></i><i></i><i></i></span><span class="tl">正在想…</span></div></div></div>');
    flow.insertBefore(t, flow.querySelector('.hint'));
    t.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(function(){ t.querySelector('.tl').textContent='正在整理…'; },1500);
    setTimeout(function(){
      t.remove(); wrap.classList.remove('generating'); busy=false;
      addRow('ai',AVMOON,'小管家','好，收到了。我先记下，办完把结果回给你，只说要紧的。');
    },3000);
  }
  function send(){
    var v=input.value.trim(); if(!v||busy) return; input.value='';
    addRow('me',AVROSE,'醒醒',v); reply(v);
  }
  document.getElementById('send').addEventListener('click',send);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });
  document.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){
      if(busy) return;
      b.parentElement.querySelectorAll('.opt').forEach(function(o){o.classList.remove('on')});
      b.classList.add('on');
      addRow('me',AVROSE,'醒醒',b.textContent); reply(b.textContent);
    });
  });
</script>
