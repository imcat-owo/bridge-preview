<style>
/* ===== 三层 token（原始层 → 语义层 → 组件层），组件里不许出现裸色值 ===== */
:root{
  /* 原始层：源头色卡 + 单源圆角 + 间距节律 */
  --moon:#EFF4F5; --ice:#9FBECB; --pale:#D8E8EC; --grey-blue:#7E9AA7; --pearl:#FEFEFC;
  --ink-src:#3E545F; --ink2-src:#5A7684; --title-src:#4E7284; --ph-src:#9DB6C0;
  --radius:20px;                 /* 基准圆角：卡片 ×1、气泡 ×0.8、选项行 ×0.6、圆钮 50%、输入栏半高 */
  --gutter:16px;
  /* 语义层：表面与其上的字成对定义 */
  --paper:var(--moon);
  --glass-face:var(--pearl); --glass-ink:var(--ink-src);
  --ink:var(--ink-src); --ink-2:var(--ink2-src); --ink-ph:var(--ph-src); --title:var(--title-src);
  --line:rgba(126,154,167,.38);
  --opt-face:rgba(216,232,236,.55); --opt-ink:var(--ink-src);
  --opt-on-face:rgba(159,190,203,.5); --opt-on-ink:var(--title-src);
  --shadow-1:0 3px 10px rgba(126,154,167,.14);
  --shadow-2:0 6px 18px rgba(126,154,167,.16);
  --breath-1:rgba(126,154,167,.38); --breath-2:rgba(159,190,203,.18);
  /* 组件层 */
  --bubble-pad:16px 10px; --card-pad:12px;
}

/* 壁纸之上的月白协调罩：中部更透，让壁纸的透光留白和消息流融为一体 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(239,244,245,.32), rgba(239,244,245,.12) 34%, rgba(239,244,245,.16) 68%, rgba(239,244,245,.38));}
header,main,footer{position:relative;z-index:1;width:100%;max-width:760px;margin-inline:auto}

/* ===== 顶部栏：44px、图片玻璃圆钮 ===== */
header{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px var(--gutter) 0}
.hbtn{width:44px;height:44px;flex:0 0 44px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hbtn img{width:40px;height:40px;display:block}
.hbtn:active{transform:scale(.94)}
.title{flex:1;text-align:center}
.title .name{font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:17px;font-weight:500;letter-spacing:.34em;text-indent:.34em;color:var(--title)}
.title .model{font-size:10px;color:var(--ink-2);margin-top:4px;letter-spacing:.14em}

/* ===== 消息流：分区距宽松档 32 ===== */
main{flex:1;padding:32px var(--gutter) 210px;display:flex;flex-direction:column;gap:32px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 28%, var(--pearl), var(--pale) 82%);
  border:1px solid var(--line);box-shadow:var(--shadow-1);
  display:flex;align-items:center;justify-content:center}
.avatar img{width:88%;height:88%;object-fit:contain;display:block}
.col{display:flex;flex-direction:column;max-width:78%}
.row.me .col{align-items:flex-end}
.who{font-size:12px;letter-spacing:.18em;color:var(--ink-2);margin:2px 2px 8px}
.who .time{font-size:10px;letter-spacing:.06em;margin-inline-start:8px}

/* 思考小条：静态完成态一行小字；进行态才有呼吸点 */
.think{margin-top:8px;margin-inline-start:2px;font-size:12px;color:var(--ink-2);letter-spacing:.08em;
  display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--grey-blue);display:block;
  animation:thinkpulse 1.6s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.22s}.dots i:nth-child(3){animation-delay:.44s}
@keyframes thinkpulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:.95;transform:scale(1.15)}}

.card .pendant{height:88px;width:auto;display:block;margin-inline:auto}
.card .t{font-size:16px;font-weight:500;letter-spacing:.2em;text-indent:.2em;color:var(--title);
  margin-top:16px;text-align:center}
.card .d{font-size:12px;color:var(--ink-2);margin-top:6px;letter-spacing:.06em;text-align:center}
.card .q{font-size:14.5px;color:var(--glass-ink);text-align:center;letter-spacing:.08em;margin:4px 0 12px}
.opt{display:block;width:100%;border:1px solid var(--line);border-radius:calc(var(--radius)*.6);
  background:var(--opt-face);color:var(--opt-ink);font-size:13px;letter-spacing:.1em;
  padding:10px 8px;margin-top:8px;cursor:pointer;text-align:center;min-height:44px}
.opt:active{transform:scale(.98)}
.opt.on{background:var(--opt-on-face);color:var(--opt-on-ink);font-weight:500}
.hint{text-align:center;font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--ink-2)}

/* ===== 底部输入区：图片胶囊面板 + 面板内真输入框与圆钮 ===== */
footer{position:sticky;bottom:0;z-index:5;padding:8px var(--gutter) calc(10px + env(safe-area-inset-bottom))}
.inputwrap{position:relative;z-index:0;aspect-ratio:1080/327;animation:fadeUp .45s ease-out both}
/* 生成中才出现的单色冰蓝呼吸雾光（软扩散、非描边秀）；空闲完全无光 */
.inputwrap::before{content:"";position:absolute;inset:0;border-radius:999px;z-index:-1;opacity:0;
  box-shadow:0 0 24px 6px var(--breath-1), 0 0 48px 16px var(--breath-2)}
.inputwrap.generating::before{animation:breath 2.6s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.3}to{opacity:.75}}
.inputwrap img.panel{position:absolute;inset:0;width:100%;height:100%;display:block}
.inputrow{position:absolute;inset-inline:0;top:26%;bottom:0;display:flex;align-items:center;padding:0 4.5%}
.inputrow input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;height:44px;
  font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:16px;color:var(--ink);
}
.inputrow input::placeholder{color:var(--ink-ph);font-style:italic}
.ibtn{width:44px;height:44px;flex:0 0 44px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.ibtn img{width:36px;height:36px;display:block}
.ibtn:active{transform:scale(.92)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>

  function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
  function addRow(cls,av,who,text){
    var r=el('<div class="row '+cls+'"><div class="avatar"><img src="'+av+'" alt=""></div>'+
      '<div class="col"><div class="who">'+who+'</div><div class="bubble"></div></div></div>');
    r.querySelector('.bubble').textContent=text;
    flow.insertBefore(r, flow.querySelector('.hint'));
    r.scrollIntoView({behavior:'smooth',block:'end'}); return r;
  }
  function reply(userText){
    if(busy) return; busy=true;
    wrap.classList.add('generating');           /* 生成中：输入栏单色冰蓝呼吸光（本流程约 3s，>2s 才有意义） */
    var t=el('<div class="row ai"><div class="avatar"><img src="'+AVBELL+'" alt=""></div>'+
      '<div class="col"><div class="who">小管家</div>'+
      '<div class="think"><span class="dots"><i></i><i></i><i></i></span><span class="tl">正在想…</span></div></div></div>');
    flow.insertBefore(t, flow.querySelector('.hint'));
    t.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(function(){ t.querySelector('.tl').textContent='正在整理…'; },1500);
    setTimeout(function(){
      t.remove(); wrap.classList.remove('generating'); busy=false;
      addRow('ai',AVBELL,'小管家','好，收到了。我先记下这件事，办完把结果回给你，只说要紧的。');
    },3000);
  }
  function send(){
    var v=input.value.trim(); if(!v||busy) return; input.value='';
    addRow('me',AVROSE,'醒醒',v); reply(v);
  }
  document.getElementById('send').addEventListener('click',send);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });
  document.querySelectorAll('.opt').forEach(function(b){
    b.addEventListener('click',function(){
      if(busy) return;
      b.parentElement.querySelectorAll('.opt').forEach(function(o){o.classList.remove('on')});
      b.classList.add('on');
      addRow('me',AVROSE,'醒醒',b.textContent); reply(b.textContent);
    });
  });
</script>
