/* ===== 三层 token（原始层 → 语义层 → 组件层），组件里不许出现裸色值 ===== */
:root{
  /* 原始层：源头色卡（图1展示板/壁纸取色）+ 单源圆角 + 间距节律 */
  --cream:#FAF3E7; --rose:#E58AA0; --pale:#F3C6CE; --grey-rose:#C08A94; --pearl:#FFFCFA;
  --pale-solid:#F2C4CC; --pale-tint:#F7E8E4;
  --ink-src:#59424B; --ink2-src:#86606C; --title-src:#9C5F6E; --ph-src:#C6A6AD;
  --radius:20px;                 /* 基准圆角：卡片 ×1、气泡 ×0.8、圆钮 50%、输入栏半高 */
  --gutter:16px;
  /* 语义层：表面与其上的字成对定义 */
  --paper:var(--cream);
  --glass-face:var(--pearl); --glass-ink:var(--ink-src);
  --ink:var(--ink-src); --ink-2:var(--ink2-src); --ink-ph:var(--ph-src); --title:var(--title-src);
  --line:rgba(192,138,148,.38);
  --shadow-1:0 3px 10px rgba(192,138,148,.14);
  --shadow-2:0 6px 18px rgba(192,138,148,.16);
  --breath-1:rgba(192,138,148,.38); --breath-2:rgba(229,138,160,.16);
  /* 组件层 */
  --bubble-pad:16px 10px; --card-pad:12px;
}

/* 壁纸之上的奶油协调罩：中部更透，让壁纸的透光留白和消息流融为一体 */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg, rgba(250,243,231,.30), rgba(250,243,231,.12) 34%, rgba(250,243,231,.16) 68%, rgba(250,243,231,.36));}
header,main,footer{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto}

/* ===== 顶部栏：44px、图片玻璃圆钮 ===== */
header{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px var(--gutter) 0}
.hbtn{width:44px;height:44px;flex:0 0 44px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;justify-content:center}
.hbtn img{width:40px;height:40px;display:block}
.hbtn.flip img{transform:scaleX(-1)}
.hbtn:active{transform:scale(.94)}
.title{flex:1;text-align:center}
.title .name{font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:17px;font-weight:500;letter-spacing:.34em;text-indent:.34em;color:var(--title)}
.title .model{font-size:10px;color:var(--ink-2);margin-top:4px;letter-spacing:.14em}

/* ===== 消息流：分区距宽松档 32 ===== */
main{flex:1;padding:32px var(--gutter) 196px;display:flex;flex-direction:column;gap:32px}
.row{display:flex;gap:8px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;overflow:hidden;
  background:radial-gradient(circle at 32% 28%, var(--pearl), var(--pale-tint) 78%);
  border:1px solid var(--line);box-shadow:var(--shadow-1);
  display:flex;align-items:center;justify-content:center}
.avatar img{width:84%;height:84%;object-fit:contain;display:block}
.col{display:flex;flex-direction:column;max-width:78%}
.row.me .col{align-items:flex-end}
.who{font-size:12px;letter-spacing:.18em;color:var(--ink-2);margin:2px 2px 8px}
.who .time{font-size:10px;letter-spacing:.06em;margin-left:8px}

/* 思考小条：静态完成态一行小字；进行态才有呼吸点 */
.think{margin-top:8px;margin-left:2px;font-size:12px;color:var(--ink-2);letter-spacing:.08em;
  display:flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}
.dots i{width:4px;height:4px;border-radius:50%;background:var(--grey-rose);display:block;

.toolcard img.pendant{height:64px;width:auto;display:block;margin:0 auto}
.toolcard .t{font-size:16px;font-weight:500;letter-spacing:.2em;text-indent:.2em;color:var(--title);margin-top:24px}
.toolcard .d{font-size:12px;color:var(--ink-2);margin-top:6px;letter-spacing:.06em}
.hint{text-align:center;font-size:10px;letter-spacing:.3em;text-indent:.3em;color:var(--ink-2)}

/* ===== 底部输入区：图片胶囊面板 + 真输入框 + 面板内圆钮 ===== */
footer{position:sticky;bottom:0;z-index:5;padding:8px var(--gutter) calc(10px + env(safe-area-inset-bottom))}
.inputwrap{position:relative;z-index:0;aspect-ratio:1080/217;animation:fadeUp .45s ease-out both}
/* 生成中才出现的单色粉呼吸雾光（软扩散、非描边秀）；空闲完全无光 */
.inputwrap::before{content:"";position:absolute;inset:0;border-radius:999px;z-index:-1;opacity:0;
  box-shadow:0 0 24px 6px var(--breath-1), 0 0 48px 16px var(--breath-2)}
.inputwrap.generating::before{animation:breath 2.6s ease-in-out infinite alternate}
@keyframes breath{from{opacity:.3}to{opacity:.75}}
.inputwrap img.panel{position:absolute;inset:0;width:100%;height:100%;display:block}
.inputrow{position:absolute;left:0;right:0;top:24%;bottom:0;display:flex;align-items:center;padding:0 4.5% 0 6.5%}
.inputrow input{
  flex:1;min-width:0;border:none;outline:none;background:transparent;height:44px;
  font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;
  font-size:16px;color:var(--ink);
}
.inputrow input::placeholder{color:var(--ink-ph);font-style:italic}
.ibtn{width:44px;height:44px;flex:0 0 44px;border:none;background:none;padding:0;margin-left:4px;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.ibtn img{width:36px;height:36px;display:block}
.ibtn:active{transform:scale(.92)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
</style>

  function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild}
  function addRow(cls,av,who,text){
    var r=el('<div class="row '+cls+'"><div class="avatar"><img src="'+av+'" alt=""></div>'+
      '<div class="col"><div class="who">'+who+'</div><div class="bubble"></div></div></div>');
    r.querySelector('.bubble').textContent=text;
    flow.insertBefore(r, flow.querySelector('.hint'));
    r.scrollIntoView({behavior:'smooth',block:'end'}); return r;
  }
  function send(){
    var v=input.value.trim(); if(!v||busy) return; busy=true; input.value='';
    addRow('me',AVROSE,'醒醒',v);
    wrap.classList.add('generating');           /* 生成中：输入栏单色粉呼吸光（>2s 才有意义，本流程约 3s） */
    var t=el('<div class="row ai"><div class="avatar"><img src="'+AVBELL+'" alt=""></div>'+
      '<div class="col"><div class="who">小管家</div>'+
      '<div class="think"><span class="dots"><i></i><i></i><i></i></span><span class="tl">正在想…</span></div></div></div>');
    flow.insertBefore(t, flow.querySelector('.hint'));
    t.scrollIntoView({behavior:'smooth',block:'end'});
    setTimeout(function(){ t.querySelector('.tl').textContent='正在整理…'; },1500);
    setTimeout(function(){
      t.remove(); wrap.classList.remove('generating'); busy=false;
      addRow('ai',AVBELL,'小管家','好，收到了。我先记下这件事，办完把结果回给你，只说要紧的。');
    },3000);
  }
  document.getElementById('send').addEventListener('click',send);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter') send(); });
</script>
