  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(250,243,231,.34)}
  header,main,footer{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto}
  /* 顶部栏：图片玻璃圆钮（作图 PNG，主体外透明） */
  header{display:flex;align-items:center;gap:10px;padding:16px 16px 4px}
  .hbtn{width:42px;height:42px;flex:0 0 42px;border:none;background:none;padding:0;cursor:pointer}
  .hbtn img{width:100%;height:100%;display:block}
  .hbtn.flip img{transform:scaleX(-1)}
  .hbtn:active{transform:scale(.94)}
  .title{flex:1;text-align:center}
  .title .name{font-family:Didot,"Playfair Display","Songti SC","STSong",Georgia,serif;font-size:16.5px;letter-spacing:.22em;color:#B07A85}
  .title .model{font-size:11px;color:#BC9AA0;margin-top:3px;letter-spacing:.1em}
  /* 消息流 */
  main{flex:1;padding:38px 20px 20px;display:flex;flex-direction:column;gap:38px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .avatar{width:40px;height:40px;flex:0 0 40px;border-radius:50%;object-fit:cover;
    background:rgba(255,252,250,.72);border:1px solid rgba(192,138,148,.35);
    box-shadow:0 3px 10px rgba(192,138,148,.16)}
  .col{display:flex;flex-direction:column;max-width:78%}
  .row.me .col{align-items:flex-end}
  .who{font-size:11px;letter-spacing:.18em;color:#B98A93;margin:3px 2px 7px}

  input.addEventListener('keydown',function(e){if(e.key==='Enter')send();});
</script>
</body>
</html>
