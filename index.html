  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:rgba(255,253,251,.38);
  }
  header,main,footer{position:relative;z-index:1}
  header{
    position:sticky;top:0;z-index:30;
    display:flex;align-items:center;gap:10px;
    padding:14px 16px 8px;
  }
  .imgbtn{position:relative;width:42px;height:42px;flex:0 0 42px;cursor:pointer;background:none;border:none}
  .imgbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .imgbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:17px;color:#7a5c68;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.9)}
  .title{flex:1;text-align:center}
  .title .name{font-size:15px;font-weight:600;letter-spacing:.14em;color:#54424c}
  .title .model{font-size:11px;color:#9b8791;margin-top:2px;letter-spacing:.08em}

  /* 侧边栏（对齐 Muse App：左抽屉，点条目进新页） */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(70,50,60,.25);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  aside{
    position:fixed;top:0;left:0;bottom:0;z-index:50;width:272px;max-width:82vw;
    transform:translateX(-105%);transition:transform .28s ease;
    background:rgba(255,253,251,.92);backdrop-filter:blur(14px);
    box-shadow:8px 0 32px rgba(170,120,140,.18);
    display:flex;flex-direction:column;overflow:hidden;
  }
  aside.on{transform:translateX(0)}
  aside .side-img{width:100%;height:150px;object-fit:cover;display:block}
  aside nav{padding:18px 10px;display:flex;flex-direction:column;gap:4px}
  aside nav a{
    display:block;padding:11px 14px;border-radius:12px;text-decoration:none;
    font-size:13.5px;color:#5c4a53;letter-spacing:.05em;
  }
  aside nav a small{display:block;font-size:11px;color:#ab939f;margin-top:3px;letter-spacing:.03em}
  aside nav a:active{background:rgba(244,225,233,.6)}
  aside .side-foot{margin-top:auto;padding:16px 24px;font-size:11px;letter-spacing:.22em;color:#b39ba6}

  main{
    flex:1;width:100%;max-width:760px;margin:0 auto;
    padding:34px 20px 20px;
    display:flex;flex-direction:column;gap:36px;
  }
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;object-fit:cover;
    border:1.5px solid rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(190,140,160,.25)}
  .who{font-size:11px;letter-spacing:.16em;color:#a08a94;margin:2px 0 6px}
  .row.me .who{text-align:right}
  /* 气泡：图片层随容器 100%×100% 拉伸（等价九宫格的中间伸缩），
     文字层留足内边距，文字永远落回图片主体内 */
  .bubble{position:relative;display:inline-block;max-width:76vw}
  .bubble img.skin{position:absolute;inset:0;width:100%;height:100%}
  .bubble .txt{position:relative;padding:30px 40px;
    font-size:14.5px;line-height:1.95;color:#453a41;
    text-shadow:0 1px 0 rgba(255,255,255,.55);word-break:break-word}
  .hint{text-align:center;font-size:11px;letter-spacing:.22em;color:#b39ba6}

  footer{
    position:sticky;bottom:0;z-index:30;
    padding:10px 14px calc(14px + env(safe-area-inset-bottom));
    width:100%;max-width:760px;margin:0 auto;
  }
  /* 输入栏：按钮行在面板内层里，几何上必被面板图片包住 */
  .input-panel{position:relative}
  .input-panel img.skin{position:absolute;inset:0;width:100%;height:100%}
  .input-inner{position:relative;padding:26px 24px 18px}
  .placeholder{padding:2px 4px;font-size:14px;color:#97808b;letter-spacing:.04em;
    text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .btn-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:0 2px}
  .btn-row .spacer{flex:1}
  .btn-row .imgbtn{width:40px;height:40px;flex-basis:40px}
</style>
</head>
<body>
