  body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:rgba(250,246,243,.46)}
  header,main,footer{position:relative;z-index:1;width:100%;max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;gap:10px;padding:16px 16px 6px}
  .imgbtn{position:relative;width:42px;height:42px;flex:0 0 42px}
  .imgbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .imgbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;color:#7a5c68;line-height:1;text-shadow:0 1px 0 rgba(255,255,255,.9)}
  .title{flex:1;text-align:center}
  .title .name{font-size:15px;font-weight:600;letter-spacing:.14em;color:#54424c}
  .title .model{font-size:11px;color:#9b8791;margin-top:2px;letter-spacing:.08em}
  main{flex:1;padding:40px 20px 24px;display:flex;flex-direction:column;gap:40px}
  .row{display:flex;gap:10px;align-items:flex-start}
  .row.me{flex-direction:row-reverse}
  .avatar{width:38px;height:38px;flex:0 0 38px;border-radius:12px;object-fit:cover;box-shadow:0 4px 12px rgba(190,140,160,.20)}
  .who{font-size:11px;letter-spacing:.16em;color:#a08a94;margin:2px 0 6px}
  .row.me .who{text-align:right}
  /* 气泡：展示板没有气泡这一项，按 TOOL CARDS 的表面语法长出来——
     卡面色 #ebe7e4/#e9dfda、细描边、圆角；纯容器承载文字，文字不可能跑出容器 */
  .bubble{display:inline-block;max-width:74vw;padding:15px 19px;border-radius:20px;
    background:linear-gradient(180deg,#f1eae6,#e9dfda);border:1px solid #ddd0c9;
    box-shadow:0 6px 18px rgba(180,140,130,.12);
    font-size:14.5px;line-height:1.95;color:#453a41;word-break:break-word}
  .row.me .bubble{background:linear-gradient(180deg,#f3e9e6,#ecddd8);border-color:#dfcdc6}
  .hint{text-align:center;font-size:11px;letter-spacing:.22em;color:#b39ba6}
  footer{position:sticky;bottom:0;z-index:5;padding:10px 14px calc(14px + env(safe-area-inset-bottom))}
  /* 输入栏：展示板 INPUT FIELD 区展示的输入框本身（裁片）作面板，
     发送钮（BUTTONS 区裁片）覆在展示图自带发送钮的位置，几何上在面板内 */
  .input-panel{position:relative;width:100%;aspect-ratio:1060/270}
  .input-panel img.skin{position:absolute;inset:0;width:100%;height:100%}
  .sendbtn{position:absolute;left:78.8%;top:51.9%;transform:translate(-50%,-50%);width:40px;height:40px}
  .sendbtn img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
  .sendbtn span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;color:#7a5c68;text-shadow:0 1px 0 rgba(255,255,255,.9)}
</style>
